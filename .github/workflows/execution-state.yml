name: Set Keeper Execution State

on:
  workflow_dispatch:
    inputs:
      state:
        type: choice
        options: [PAUSE, UNPAUSE]
        required: true
      confirmation:
        description: Type SET-EXECUTION-STATE-327
        required: true

jobs:
  state:
    if: github.event.inputs.confirmation == 'SET-EXECUTION-STATE-327'
    environment: keeper-production
    runs-on: ubuntu-latest
    steps:
      - name: Apply authenticated database gate
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          STATE: ${{ github.event.inputs.state }}
        run: |
          PAUSED=true
          if [ "$STATE" = "UNPAUSE" ]; then PAUSED=false; fi
          BODY=$(printf '{"paused":%s}' "$PAUSED")
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-admin-key: $ADMIN_API_KEY" \
            --data "$BODY" \
            "$WORKER_URL/api/v1/admin/pause"
