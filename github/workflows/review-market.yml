name: Review Discovered Market

on:
  workflow_dispatch:
    inputs:
      pair_address:
        description: Verified Onyx pair address
        required: true
      decision:
        type: choice
        options: [APPROVE, REMOVE]
        required: true
      confirmation:
        description: Type REVIEW-MARKET-327
        required: true

jobs:
  review:
    if: github.event.inputs.confirmation == 'REVIEW-MARKET-327'
    environment: keeper-production
    runs-on: ubuntu-latest
    steps:
      - name: Submit authenticated review
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          PAIR: ${{ github.event.inputs.pair_address }}
          DECISION: ${{ github.event.inputs.decision }}
        run: |
          REVIEWED=false
          if [ "$DECISION" = "APPROVE" ]; then REVIEWED=true; fi
          BODY=$(printf '{"pairAddress":"%s","reviewed":%s}' "$PAIR" "$REVIEWED")
          curl --fail-with-body --silent --show-error \
            -H "content-type: application/json" \
            -H "x-admin-key: $ADMIN_API_KEY" \
            --data "$BODY" \
            "$WORKER_URL/api/v1/admin/market-review"
