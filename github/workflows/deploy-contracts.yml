name: Deploy Onyx Contracts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-ONYX-327
        required: true

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY-ONYX-327'
    environment: onyx-mainnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - run: npm install
      - run: npm run compile
      - run: npm test
      - name: Verify current Onyx dependencies
        run: npm run verify:onyx -w @flowcontrol/contracts
        env:
          ONYX_RPC_URL: https://rpc.onyx.org
      - name: Deploy
        run: npm run deploy:onyx -w @flowcontrol/contracts
        env:
          ONYX_RPC_URL: https://rpc.onyx.org
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          FINAL_ADMIN_ADDRESS: ${{ secrets.FINAL_ADMIN_ADDRESS }}
          TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
          RESERVE_ADDRESS: ${{ secrets.RESERVE_ADDRESS }}
          FLOW_PLAN_XCN: ${{ vars.FLOW_PLAN_XCN }}
          PRO_PLAN_XCN: ${{ vars.PRO_PLAN_XCN }}
          CREATOR_PLAN_XCN: ${{ vars.CREATOR_PLAN_XCN }}
      - uses: actions/upload-artifact@v7
        with:
          name: onyx-deployment-addresses
          path: deployments.onyx.json
