name: Deploy Keeper Worker (Shadow)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-SHADOW
        required: true

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY-SHADOW'
    environment: keeper-shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - run: npm install
      - run: npm run build -w @flowcontrol/keeper-worker
      - name: Render Worker configuration
        run: python3 scripts/render_worker_config.py
        env:
          FLOW_VAULT_FACTORY: ${{ vars.FLOW_VAULT_FACTORY }}
          FLOW_EXECUTION_ROUTER: ${{ vars.FLOW_EXECUTION_ROUTER }}
          FLOW_ADAPTER: ${{ vars.FLOW_ADAPTER }}
          FLOW_TOKEN_REGISTRY: ${{ vars.FLOW_TOKEN_REGISTRY }}
          FLOW_STRATEGY_REGISTRY: ${{ vars.FLOW_STRATEGY_REGISTRY }}
          FLOW_TIER_MANAGER: ${{ vars.FLOW_TIER_MANAGER }}
          ALLOWED_WEB_ORIGIN: ${{ vars.ALLOWED_WEB_ORIGIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply flowcontrol-ai-trader --remote -c apps/keeper-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Bootstrap shadow Worker
        run: npx wrangler deploy -c apps/keeper-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload executor secret
        run: printf '%s' "$EXECUTOR_PRIVATE_KEY" | npx wrangler secret put EXECUTOR_PRIVATE_KEY -c apps/keeper-worker/wrangler.toml
        env:
          EXECUTOR_PRIVATE_KEY: ${{ secrets.EXECUTOR_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload admin API secret
        run: printf '%s' "$ADMIN_API_KEY" | npx wrangler secret put ADMIN_API_KEY -c apps/keeper-worker/wrangler.toml
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Final shadow deployment
        run: npx wrangler deploy -c apps/keeper-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
