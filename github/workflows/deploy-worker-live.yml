name: Deploy Keeper Worker (Live Gate Only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY-LIVE-GATED-327
        required: true

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY-LIVE-GATED-327'
    environment: keeper-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - run: npm install
      - run: npm run build -w @flowcontrol/keeper-worker
      - name: Render Worker configuration
        run: |
          python3 scripts/render_worker_config.py
          sed -i 's/LIVE_EXECUTION = "false"/LIVE_EXECUTION = "true"/' apps/keeper-worker/wrangler.toml
        env:
          FLOW_VAULT_FACTORY: ${{ vars.FLOW_VAULT_FACTORY }}
          FLOW_EXECUTION_ROUTER: ${{ vars.FLOW_EXECUTION_ROUTER }}
          FLOW_ADAPTER: ${{ vars.FLOW_ADAPTER }}
          FLOW_TOKEN_REGISTRY: ${{ vars.FLOW_TOKEN_REGISTRY }}
          FLOW_STRATEGY_REGISTRY: ${{ vars.FLOW_STRATEGY_REGISTRY }}
          FLOW_TIER_MANAGER: ${{ vars.FLOW_TIER_MANAGER }}
          ALLOWED_WEB_ORIGIN: ${{ vars.ALLOWED_WEB_ORIGIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      - name: Deploy with code gate enabled
        run: npx wrangler deploy -c apps/keeper-worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm database kill switch stays paused
        run: |
          VALUE=$(npx wrangler d1 execute flowcontrol-ai-trader --remote -c apps/keeper-worker/wrangler.toml --command="SELECT value FROM system_state WHERE key='execution_paused'" --json)
          echo "$VALUE" | grep -q 'true' || { echo 'Database gate must remain paused'; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
